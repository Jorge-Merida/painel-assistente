<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Verificação</title><link rel="stylesheet" href="../site/assets/styles.css"><body>
<form id="search-form"><input id="query"><select id="uf"><option value=""></select><select id="adesao"><option value=""></select><button id="search-button">Pesquisar</button></form><div id="results"></div><p id="status"></p><p id="notice" hidden></p><p id="empty" hidden></p><button id="load-more" hidden>Mais</button><pre id="test-result">RUNNING</pre>
<script type="module">
const errors=[]; window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
const raw={numero_controle_pncp:'15126437000305-1-003108/2026-000007',title:'Ata 190',description:'Equipamentos incluindo esfigmomanômetro',orgao_nome:'Hospital',municipio_nome:'Lagarto',uf:'SE',data_inicio_vigencia:'2020-01-01',data_fim_vigencia:'2999-12-31'};
const { config } = await import('../site/apps/atas/config.js'); config.supplierServiceUrl='https://test-suppliers.workers.dev';
let pages=[];let docCalls=0;let fail=true;let atasFail=true;
window.fetch=async value=>{
 const url=new URL(value);let data;
 if(url.pathname==='/fornecedores'){const id=url.searchParams.get('ata');const page=Number(url.searchParams.get('pagina'));if(id.endsWith('-3'))return {ok:false,status:502};data={status:'ok',suppliers:id.endsWith('-1')?[{name:'FORNECEDOR DA ATA UM',id:'47751972000181'}]:[],hasMore:id.endsWith('-1')&&page===1,nextPage:2};}
 else if(url.pathname==='/api/search/')data={total:2,items:[raw,{...raw,numero_controle_pncp:'15126437000305-1-003108/2026-000006'}]};
 else if(url.pathname.endsWith('/atas')){
 if(atasFail){atasFail=false;return {ok:false,status:503};}
 data={data:[1,2,3,4,5,6,7].map(n=>({numeroAtaRegistroPreco:String(183+n),anoAta:2026,sequencialAta:n,dataVigenciaInicio:'2020-01-01',dataVigenciaFim:n===1?'2020-10-01':'2999-12-31',cancelado:n===2,possibilidadeAdesao:false})),totalPaginas:1};}
 else if(url.pathname.endsWith('/arquivos')){docCalls++;data=[{sequencialDocumento:1,titulo:'Ata principal'},{sequencialDocumento:2,titulo:'Anexo'}];}
 else if(url.pathname.endsWith('/resultados'))data=[{valorUnitarioHomologado:200,nomeRazaoSocialFornecedor:'GM FARMA COMERCIAL LTDA',quantidadeHomologada:60}];
 else if(url.pathname.endsWith('/itens')){const page=Number(url.searchParams.get('pagina'));pages.push(page);if(page===2&&fail)return {ok:false,status:503};data=page===1?Array.from({length:100},(_,i)=>({numeroItem:i+1,descricao:'Balança',temResultado:false})): [{numeroItem:101,descricao:'Esfigmomanômetro digital',temResultado:true}];}
 else throw Error('URL inesperada '+url);
 return {ok:true,json:async()=>data};
};
const wait=async check=>{for(let i=0;i<500;i++){if(check())return;await new Promise(r=>setTimeout(r,20));}throw Error('Tempo esgotado');};
const assert=(v,m)=>{if(!v)throw Error(m);};
try {
 await import('../site/apps/atas/app.js');document.querySelector('#query').value='esfigmomanometro';document.querySelector('#search-form').requestSubmit();
 await wait(()=>document.querySelectorAll('.result-card').length);
 assert(document.querySelectorAll('.result-card').length===1,'Agrupamento');
 document.querySelector('.result-card > button').click();
 await wait(()=>document.querySelectorAll('.items-panel > .purchase-list:first-of-type .purchase-item').length===7);
 await wait(()=>document.querySelector('#results').textContent.includes('FORNECEDOR DA ATA UM')&&document.querySelector('#results').textContent.includes('Não foi possível consultar o fornecedor'));
 const ataRows=document.querySelectorAll('.items-panel > .purchase-list:first-of-type > .purchase-item');
 assert(ataRows[0].textContent.includes('FORNECEDOR DA ATA UM'),'Fornecedor na ata exata');
 assert(!ataRows[1].textContent.includes('FORNECEDOR DA ATA UM'),'Não atribuir fornecedor à ata vizinha');
 assert(ataRows[2].textContent.includes('Não foi possível consultar o fornecedor'),'Falha complementar isolada');
 assert(document.querySelector('#results').textContent.includes('Cancelada')&&document.querySelector('#results').textContent.includes('Fora da vigência'),'Situações de atas');
 const buttons=[...document.querySelectorAll('button')];buttons.find(b=>b.textContent==='Ver documentos para download').click();
 await wait(()=>document.querySelectorAll('.ata-documents a').length===2);
 assert([...document.querySelectorAll('.ata-documents a')].every(a=>a.href.includes('pncp.gov.br/api/pncp/v1/')),'Links dos documentos');
 document.querySelector('.item-search').requestSubmit();await wait(()=>document.querySelector('.item-search button').disabled===false);
 assert(document.querySelector('#results').textContent.includes('resultado é parcial'),'Falha indicada como parcial');
 fail=false;document.querySelector('.item-search').requestSubmit();await wait(()=>document.querySelector('#results').textContent.includes('GM FARMA'));
 assert(document.querySelectorAll('.items-panel > .purchase-list:last-of-type .purchase-item').length===1,'Filtro sem acentos');
 assert(pages.filter(p=>p===1).length===1,'Retomada sem repetir página');
 assert(document.querySelector('#results').textContent.includes('Consulta completa.'),'Busca completa');
 document.querySelector('.item-search input').value='naoexiste';document.querySelector('.item-search').requestSubmit();await wait(()=>document.querySelector('.item-search button').disabled===false);
 assert(document.querySelector('#results').textContent.includes('0 item(ns) encontrado(s)'),'Sem resultados');
 document.querySelector('.item-search input').value='';document.querySelector('.item-search').requestSubmit();await wait(()=>document.querySelector('.item-search button').disabled===false);
 assert(document.querySelectorAll('.items-panel > .purchase-list:last-of-type .purchase-item').length===20,'Primeiros vinte itens');
 document.querySelector('.items-more').click();await wait(()=>document.querySelectorAll('.items-panel > .purchase-list:last-of-type .purchase-item').length===40);
 assert(!errors.length,errors.join(';'));
 document.querySelector('#test-result').textContent='PASS: fornecedores por ata, falha isolada, agrupamento, 7 atas, situações, múltiplos documentos, busca sem acentos além da primeira página, falha parcial, retomada, cache e filtro vazio. Páginas: '+pages;
} catch(e){document.querySelector('#test-result').textContent='FAIL: '+e.stack;}
</script></body></html>
